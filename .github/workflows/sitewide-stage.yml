name: Sitewide design implementation staging
on:
  push:
    branches: [design/sitewide-2026-09-23]
permissions:
  contents: write
concurrency:
  group: sitewide-stage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: bacwater_audit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U audit -d bacwater_audit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://audit:isolated-ci-only@127.0.0.1:5432/bacwater_audit
      AUTH_SECRET: ci-placeholder-not-a-real-secret
      AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
      AUDIT_ORIGIN: http://127.0.0.1:3000
      AUDIT_OUT: audit-evidence/after
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply checksummed source from reviewed local work
        run: |
          mkdir -p audit-evidence
          python - <<'PY'
          import base64,lzma,json,hashlib
          from pathlib import Path
          raw=''.join(Path(f'audit/transport/sitewide.{i}.b64').read_text().strip() for i in range(5))
          data=lzma.decompress(base64.b64decode(raw))
          assert hashlib.sha256(data).hexdigest()=='0c53e311ba0ca992a2984a3c013e1728a32b2a49ed88ebadfc7bf9ffead55e4e','Transport checksum mismatch'
          changes=json.loads(data); prepared={}
          for name,change in changes.items():
            p=Path(name)
            assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
            if 'content' in change:
              text=change['content']
              if p.exists(): assert p.read_text()==text, f'New-file conflict: {name}'
            else:
              old=p.read_text()
              if hashlib.sha256(old.encode()).hexdigest()==change['after']: continue
              assert hashlib.sha256(old.encode()).hexdigest()==change['before'],f'Baseline conflict: {name}'
              lines=old.splitlines(keepends=True)
              for a,b,new in reversed(change['edits']): lines[a:b]=new
              text=''.join(lines)
              assert hashlib.sha256(text.encode()).hexdigest()==change['after'],f'Output conflict: {name}'
            prepared[name]=text
          for name,text in prepared.items():
            p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          Path('/tmp/bacwater-changed-paths.json').write_text(json.dumps(list(changes)))
          print(f'Verified {len(changes)} paths. Applied {len(prepared)} changes.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and prepare only the disposable database
        run: |
          npm ci
          npx prisma generate
          case "$DATABASE_URL" in
            postgresql://audit:*@127.0.0.1:5432/bacwater_audit) ;;
            *) exit 1 ;;
          esac
          npx prisma db push --skip-generate
          npx tsx prisma/seed.ts
          npm audit --json > audit-evidence/dependency-audit.json || true
      - name: Typecheck and assertion suites
        run: |
          set -o pipefail
          npx tsc -p tsconfig.build.json --noEmit 2>&1 | tee audit-evidence/typecheck.log
          npm test 2>&1 | tee audit-evidence/tests.log
          npm run test:design 2>&1 | tee audit-evidence/design-tests.log
          npx tsx scripts/audit-publication.ts 2>&1 | tee audit-evidence/publication-tests.log
          npx tsx scripts/audit-remaining.ts 2>&1 | tee audit-evidence/remaining-tests.log
      - name: Build with stale development files retained
        run: |
          set -o pipefail
          node scripts/audit-build-type-isolation.mjs seed
          npm run build 2>&1 | tee audit-evidence/build.log
          node scripts/audit-build-type-isolation.mjs verify 2>&1 | tee audit-evidence/build-type-isolation.log
      - name: Commit verified source only to the isolated design branch
        run: |
          test "$GITHUB_REF" = refs/heads/design/sitewide-2026-09-23
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          paths=json.loads(Path('/tmp/bacwater-changed-paths.json').read_text())
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'design: roll out clear calculator-first layouts and research supplier slider'
            git push origin HEAD:design/sitewide-2026-09-23
          fi
          git rev-parse HEAD > audit-evidence/source-commit.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.63.0
      - name: Install browser tools
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.63.0 axe-core@4.13.0
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get install -y poppler-utils
      - name: Start test app
        id: server
        run: |
          npx next start --hostname 127.0.0.1 --port 3000 > audit-evidence/server.log 2>&1 &
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/robots.txt && exit 0 || sleep 2; done
          exit 1
      - name: Verify redesigned routes and the supplier slider
        run: node scripts/audit-sitewide-design.mjs
      - name: Verify publication lifecycle
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node scripts/audit-publication-browser.mjs
      - name: Verify converter and explanation journeys
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: |
          node scripts/audit-converters.mjs
          node scripts/audit-remaining-browser.mjs
      - name: Verify saved accounts and private PDFs
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: |
          node scripts/audit-journeys.mjs
          pdftotext audit-evidence/journeys/owner.pdf audit-evidence/journeys/owner.txt
          pdftotext audit-evidence/journeys/shared.pdf audit-evidence/journeys/shared.txt
          grep -q 'PRIVATE NOTE' audit-evidence/journeys/owner.txt
          if grep -q 'PRIVATE NOTE' audit-evidence/journeys/shared.txt; then exit 1; fi
      - name: Capture complete public inventory and responsive engines
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node scripts/master-audit.mjs
      - name: Preserve resulting source and evidence
        if: always()
        run: |
          mkdir -p audit-evidence
          git add -A -- src public/brand scripts package.json .env.example audit/2026-09-23 .github/workflows/master-audit.yml
          git archive --format=tar $(git write-tree) > audit-evidence/source.tar
          git diff HEAD > audit-evidence/uncommitted.patch
          git status --short > audit-evidence/worktree-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sitewide-design-evidence-${{ github.sha }}
          path: audit-evidence/
          retention-days: 14
