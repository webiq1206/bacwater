name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch cancels the run still going for the first.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    env:
      # next build imports the app's modules, so it needs the same variables the
      # runtime expects. These are throwaway values that only have to parse:
      # DATABASE_URL has to be a valid postgresql:// URL for the Prisma
      # datasource to validate, and nothing in CI connects to a database.
      # Pages that query Prisma catch their own failures and render empty, which
      # is the same path a cold production boot takes.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-placeholder-not-a-real-secret
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: https://bacwater.ai
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json is the lockfile the deploy uses. Note the repo also
      # carries a stale pnpm-lock.yaml that nothing reads.
      - name: Install dependencies
        run: npm ci

      # Explicit rather than relying on the @prisma/client postinstall, and it
      # mirrors the deploy build in .replit.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # Runs the calc and AI-guardrail assertion suites. `npm run build` would
      # trigger these anyway via prebuild, but running them as their own step
      # means a failure names itself instead of hiding inside a build log.
      - name: Test
        run: npm test

      - name: Build
        run: npx next build
