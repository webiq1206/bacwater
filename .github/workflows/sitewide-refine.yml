name: Prepare final design refinements
on:
  push:
    branches: [design/refinements-2026-09-23]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: bacwater_audit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U audit -d bacwater_audit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://audit:isolated-ci-only@127.0.0.1:5432/bacwater_audit
      AUTH_SECRET: ci-placeholder-not-a-real-secret
      AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact reviewed refinements
        run: |
          python - <<'PY'
          import json,gzip,base64,hashlib
          from pathlib import Path
          data=gzip.decompress(base64.b64decode(Path('audit/transport/sitewide-refinements.b64').read_text()))
          assert hashlib.sha256(data).hexdigest()=='fee75c52412a8f3911deb1e3ef50ee234021a34dc1ca08fb45dae116763202f4'
          changes=json.loads(data);ready={}
          for name,row in changes.items():
            p=Path(name);assert not p.is_absolute() and '..' not in p.parts and name.startswith(('.env.example','src/'))
            old=p.read_text();digest=hashlib.sha256(old.encode()).hexdigest()
            if digest==row['after']:continue
            assert digest==row['before'],name
            lines=old.splitlines(keepends=True)
            for a,b,text in reversed(row['edits']):lines[a:b]=text
            text=''.join(lines);assert hashlib.sha256(text.encode()).hexdigest()==row['after'],name
            ready[p]=text
          for p,text in ready.items():p.write_text(text)
          print('Applied',len(ready),'reviewed paths.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify source in disposable database
        run: |
          mkdir -p audit-evidence
          npm ci
          npx prisma generate
          case "$DATABASE_URL" in postgresql://audit:*@127.0.0.1:5432/bacwater_audit) ;; *) exit 1 ;; esac
          npx prisma db push --skip-generate
          npx tsx prisma/seed.ts
          npx tsc -p tsconfig.build.json --noEmit
          npm run test:design
          npm run build
      - name: Preserve validated source on refinement branch
        run: |
          test "$GITHUB_REF" = refs/heads/design/refinements-2026-09-23
          git add src .env.example
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'design: refine wordmark sizing and simplify supplier copy'
            git push origin HEAD:design/refinements-2026-09-23
          fi
      - name: Capture source state
        if: always()
        run: |
          mkdir -p audit-evidence
          git rev-parse HEAD > audit-evidence/source-commit.txt
          git add src .env.example
          git archive --format=tar $(git write-tree) > audit-evidence/source.tar
          git diff HEAD > audit-evidence/uncommitted.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-design-source-${{ github.sha }}
          path: audit-evidence/
          retention-days: 7
