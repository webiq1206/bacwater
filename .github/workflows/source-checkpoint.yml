name: Source checkpoint
on:
  push:
    branches: [audit/finish-2026-09-21]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir -p source-checkpoint
          git rev-parse HEAD > source-checkpoint/commit.txt
          git archive --format=tar HEAD > source-checkpoint/source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: source-checkpoint
          path: source-checkpoint/
          retention-days: 7
