name: Publication lifecycle implementation
on:
  push:
    branches: [fix/publication-lifecycle-2026-09-21]
permissions:
  contents: write
concurrency:
  group: publication-implementation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: bacwater_audit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U audit -d bacwater_audit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://audit:isolated-ci-only@127.0.0.1:5432/bacwater_audit
      AUTH_SECRET: ci-placeholder-not-a-real-secret
      AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
      AUDIT_ORIGIN: http://127.0.0.1:3000
      AUDIT_OUT: audit-evidence/after
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply publication source once
        run: |
          mkdir -p audit-evidence
          if [ ! -f src/lib/content/publication-store.ts ]; then python scripts/apply-publication-upgrade.py; fi
          git add src prisma next.config.ts
          if ! git diff --cached --quiet; then
            test "$GITHUB_REF" = refs/heads/fix/publication-lifecycle-2026-09-21
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: validated publication controls and durable discovery notifications'
            git push origin HEAD:fix/publication-lifecycle-2026-09-21
          fi
      - name: Preserve source checkpoint
        if: always()
        run: |
          mkdir -p audit-evidence
          git add src prisma next.config.ts
          git archive --format=tar $(git write-tree) > audit-evidence/source.tar
          git rev-parse HEAD > audit-evidence/source-commit.txt
          git diff HEAD > audit-evidence/uncommitted.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-source-${{ github.sha }}
          path: audit-evidence/
          retention-days: 14
      - name: Install and initialize disposable fixtures
        run: |
          npm ci
          npx prisma generate
          case "$DATABASE_URL" in
            postgresql://audit:*@127.0.0.1:5432/bacwater_audit) ;;
            *) echo 'Refusing non-test database'; exit 1 ;;
          esac
          npx prisma db push --skip-generate
          npx tsx prisma/seed.ts
          npm audit --json > audit-evidence/dependency-audit.json || true
      - name: Typecheck and existing tests
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee audit-evidence/typecheck.log
          npm test 2>&1 | tee audit-evidence/tests.log
      - name: Publication transaction and notification tests
        run: set -o pipefail; npx tsx scripts/audit-publication.ts 2>&1 | tee audit-evidence/publication-tests.log
      - name: Production build
        run: set -o pipefail; npx next build 2>&1 | tee audit-evidence/build.log
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.63.0
      - name: Install browser tools
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.63.0 axe-core@4.13.0
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get install -y poppler-utils
      - name: Browser lifecycle and private application journeys
        run: |
          npx next start --hostname 127.0.0.1 --port 3000 > audit-evidence/server.log 2>&1 &
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/robots.txt && break || sleep 2; done
          node scripts/audit-publication-browser.mjs
          node scripts/audit-journeys.mjs
          pdftotext audit-evidence/journeys/owner.pdf audit-evidence/journeys/owner.txt
          pdftotext audit-evidence/journeys/shared.pdf audit-evidence/journeys/shared.txt
          grep -q 'PRIVATE NOTE' audit-evidence/journeys/owner.txt
          if grep -q 'PRIVATE NOTE' audit-evidence/journeys/shared.txt; then exit 1; fi
      - name: Full public-page regression
        run: node scripts/master-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-verification-${{ github.sha }}
          path: audit-evidence/
          retention-days: 14
