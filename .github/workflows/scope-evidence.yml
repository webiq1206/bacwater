name: Remaining scope development dependencies
on:
  push:
    branches: [audit/remaining-scope-2026-09-21]
    paths: [.github/workflows/scope-evidence.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare the reviewed lockfile for offline analysis
        run: |
          npm ci
          npx prisma generate
          mkdir -p development-evidence
          sha256sum package-lock.json > development-evidence/lockfile.sha256
          tar --exclude='*.ttf' --exclude='*.otf' --exclude='*.woff' --exclude='*.woff2' --exclude='*.eot' -czf development-evidence/dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: offline-typecheck-dependencies
          path: development-evidence/
          retention-days: 1
