name: Product review workspace
on:
  push:
    branches: [product-clarity-2026-09-25]
    paths: [.github/workflows/product-review-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive HEAD -o /tmp/product-review-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: product-review-source
          path: /tmp/product-review-source.zip
          retention-days: 1
