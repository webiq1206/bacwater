name: Assemble verified session source
on:
  push:
    branches: [delivery/session-schedule-source-2026-09-24]
    paths: [.github/workflows/assemble-session-source.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply only the reviewed source delta
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          base = '070f21e76c996672d91934fe4fa0593f1b1d13eb'
          expected = 'c48a77ef08902ad1ea3dbf4d90cc6c173699a271'
          payload = ''.join(pathlib.Path(f'delivery/session-payload.{n:02}').read_text().strip() for n in range(1,5))
          raw = lzma.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '2396eeb10e2c0c2d640748e0ad5592e4b5bacaaac39f793c58a1c5bca0b884db'
          records = json.loads(raw)
          subprocess.run(['git', 'checkout', '--detach', base], check=True)
          paths = []
          for r in records:
              p = pathlib.Path(r['path'])
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              assert p.parts[0] in ['src', 'scripts', 'audit', '.github', 'package.json']
              old = p.read_text() if p.exists() else ''
              assert hashlib.sha256(old.encode()).hexdigest() == r['old'], str(p) + ': wrong base'
              lines = old.splitlines(keepends=True)
              for a, b, replacement in reversed(r['ops']):
                  assert 0 <= a <= b <= len(lines)
                  lines[a:b] = replacement.splitlines(keepends=True)
              new = ''.join(lines)
              assert hashlib.sha256(new.encode()).hexdigest() == r['new'], str(p) + ': wrong output'
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(new)
              paths.append(str(p))
          subprocess.run(['git', 'add', '--', *paths], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == expected, f'Unexpected source tree: {tree}'
          print('Verified full source tree:', tree)
          subprocess.run(['git', 'config', 'user.name', 'webIQ'], check=True)
          subprocess.run(['git', 'config', 'user.email', 'info@webiq.co'], check=True)
          commit = subprocess.check_output(['git', 'commit-tree', tree, '-p', base], input='fix: preserve calculator sessions and clarify each-time and weekly amounts\n', text=True).strip()
          subprocess.run(['git', 'push', 'origin', commit + ':refs/heads/fix/session-schedule-2026-09-24'], check=True)
          print('Review commit:', commit)
          PY
