name: One-time Next security lock repair
on:
  push:
    branches: ['fix/next-security-2026-09-24']
permissions:
  contents: read
jobs:
  regenerate:
    if: github.repository == 'webiq1206/bacwater' && github.ref == 'refs/heads/fix/next-security-2026-09-24'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate the Next-only lock entries with npm
        run: |
          mkdir -p audit-evidence/next-security
          cp package-lock.json /tmp/bacwater-lock-before.json
          npm install --package-lock-only --ignore-scripts
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('/tmp/bacwater-lock-before.json','utf8'));
          const after=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          assert.equal(after.packages[''].dependencies.next,'16.3.6');
          assert.equal(after.packages['node_modules/next'].version,'16.3.6');
          const changed=[...new Set([...Object.keys(before.packages),...Object.keys(after.packages)])].filter(p=>JSON.stringify(before.packages[p])!==JSON.stringify(after.packages[p]));
          for(const path of changed){
            assert.ok(path===''||/^node_modules\/(?:next|@next\/(?:env|swc-[a-z0-9-]+))$/.test(path),`Unexpected unrelated lockfile change: ${path}`);
          }
          fs.writeFileSync('audit-evidence/next-security/lock-changes.json',JSON.stringify(changed,null,2));
          console.log('Changed package entries:',changed);
          JS
          git diff --exit-code -- package.json
      - name: Clean install with all normal lifecycle and security checks enabled
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          set -o pipefail
          npm ci --include=dev 2>&1 | tee audit-evidence/next-security/install.log
          npm test 2>&1 | tee audit-evidence/next-security/tests.log
          npm audit --json > audit-evidence/next-security/npm-audit.json || true
          node -e 'const a=require("./audit-evidence/next-security/npm-audit.json");if(!a.metadata||a.metadata.vulnerabilities.critical||a.metadata.vulnerabilities.high)process.exit(1)'
          cp package-lock.json audit-evidence/next-security/package-lock.json
      - name: Commit only the npm-generated lockfile to this repair branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const repo='webiq1206/bacwater',branch='fix/next-security-2026-09-24';
          assert.equal(process.env.GITHUB_REPOSITORY,repo);
          assert.equal(process.env.GITHUB_REF,`refs/heads/${branch}`);
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          const ref=await fetch(`https://api.github.com/repos/${repo}/git/ref/heads/${branch}`,{headers});
          if(!ref.ok)throw new Error(`Ref read failed: ${ref.status}`);
          assert.equal((await ref.json()).object.sha,process.env.GITHUB_SHA,'The repair branch moved. Stop rather than overwrite another commit.');
          const oldSha=execFileSync('git',['rev-parse','HEAD:package-lock.json'],{encoding:'utf8'}).trim();
          const response=await fetch(`https://api.github.com/repos/${repo}/contents/package-lock.json`,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({message:'Regenerate Next 16.3.6 lockfile with npm and verify clean installation',branch,sha:oldSha,content:fs.readFileSync('package-lock.json').toString('base64')})});
          if(!response.ok)throw new Error(`Lockfile commit failed: ${response.status}`);
          const data=await response.json();
          fs.writeFileSync('audit-evidence/next-security/lock-commit.txt',data.commit.sha+'\n');
          console.log('Generated lockfile commit:',data.commit.sha);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-security-lock-repair
          path: audit-evidence/next-security/
          retention-days: 7
