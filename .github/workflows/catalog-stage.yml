name: Catalog source verification
on:
  push:
    branches: [feat/supplier-neutral-catalog-2026-09-23]
    paths: [.github/workflows/catalog-stage.yml]
permissions:
  contents: write
concurrency:
  group: catalog-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: bacwater_audit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U audit -d bacwater_audit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://audit:isolated-ci-only@127.0.0.1:5432/bacwater_audit
      AUTH_SECRET: ci-placeholder-not-a-real-secret
      AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
      AUDIT_ORIGIN: http://127.0.0.1:3000
      AUDIT_OUT: audit-evidence/after
    steps:
      - uses: actions/checkout@v4
      - name: Apply checksummed source once
        run: |
          mkdir -p audit-evidence
          if [ ! -f src/lib/partners/supplier-catalog.ts ]; then
            python - <<'PY'
          from pathlib import Path
          import json,base64,gzip,hashlib
          raw=''.join(Path(f'audit/transport/catalog.{i}.b64').read_text().strip() for i in range(4))
          data=gzip.decompress(base64.b64decode(raw,validate=True))
          assert hashlib.sha256(data).hexdigest()=='5ec4e1376ea6d4385d7d544f8da5eaf17c6a65da315d61b2b7f45392662e6ee7'
          prepared={}
          for name,change in json.loads(data).items():
            p=Path(name)
            assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
            old=p.read_text() if p.exists() else None
            if change.get('delete'):
              if old is None: continue
              assert hashlib.sha256(old.encode()).hexdigest()==change['before'],name
              prepared[name]=None
              continue
            if old is not None and hashlib.sha256(old.encode()).hexdigest()==change['after']: continue
            if 'content' in change:
              assert old is None,name
              new=change['content']
            else:
              if old is None and change['before']==hashlib.sha256(b'').hexdigest(): old=''
              assert old is not None and hashlib.sha256(old.encode()).hexdigest()==change['before'],name
              new=old
              for a,b,text in reversed(change['edits']): new=new[:a]+text+new[b:]
            assert hashlib.sha256(new.encode()).hexdigest()==change['after'],name
            prepared[name]=new
          for name,new in prepared.items():
            p=Path(name)
            if new is None: p.unlink()
            else: p.parent.mkdir(parents=True,exist_ok=True);p.write_text(new)
          print(f'Applied {len(prepared)} verified source paths.')
          PY
          fi
          python - <<'PY'
          from pathlib import Path
          for name in ['src/components/partners/product-slider.tsx','src/components/partners/calculator-products.tsx']:
            p=Path(name);s=p.read_text()
            if '<select aria-label="Product type" value={kind}' not in s:
              assert '<select value={kind}' in s,name
              p.write_text(s.replace('<select value={kind}','<select aria-label="Product type" value={kind}'))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and prepare isolated fixtures
        run: |
          npm ci
          npx prisma generate
          case "$DATABASE_URL" in
            postgresql://audit:*@127.0.0.1:5432/bacwater_audit) ;;
            *) echo 'Refusing a non-test database'; exit 1 ;;
          esac
          npx prisma db push --skip-generate
          npx tsx prisma/seed.ts
      - name: Typecheck and all source assertions
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee audit-evidence/typecheck.log
          npm test 2>&1 | tee audit-evidence/tests.log
          npm run test:design 2>&1 | tee audit-evidence/design-tests.log
      - name: Production build
        id: compile
        run: set -o pipefail; npm run build 2>&1 | tee audit-evidence/build.log
      - name: Preserve application source on isolated branch
        run: |
          test "$GITHUB_REF" = refs/heads/feat/supplier-neutral-catalog-2026-09-23
          git add -A -- src scripts package.json audit/2026-09-23
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: supplier-neutral product catalog and typed calculators for review'
            git push origin HEAD:feat/supplier-neutral-catalog-2026-09-23
          fi
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.63.0
      - name: Install audit-only browser dependencies
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.63.0 axe-core@4.13.0
          npx playwright install --with-deps chromium webkit
      - name: Verify products, neutral copy, images and calculator journeys
        run: |
          npx next start --hostname 127.0.0.1 --port 3000 > audit-evidence/server.log 2>&1 &
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/robots.txt && break || sleep 2; done
          node scripts/audit-product-catalog.mjs
      - name: Preserve exact source and verification evidence
        if: always()
        run: |
          mkdir -p audit-evidence
          git rev-parse HEAD > audit-evidence/source-commit.txt
          git add -A -- src scripts package.json audit/2026-09-23 .github/workflows/master-audit.yml
          git archive --format=tar $(git write-tree) > audit-evidence/source.tar
          git diff HEAD > audit-evidence/uncommitted.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-stage-${{ github.sha }}
          path: audit-evidence/
          retention-days: 14
