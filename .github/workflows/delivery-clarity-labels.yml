name: Assemble reviewed clarity and label source
on:
  push:
    branches: [delivery/clarity-labels-2026-09-24]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: payload
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: release
          ref: 9e20583e35af8917dde427198aa2063d7d66a126
      - name: Apply only the reviewed text and verify every blob and the complete tree
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          source=pathlib.Path('payload'); root=pathlib.Path('release')
          edits=json.loads((source/'.delivery/edits-a.json').read_text())+json.loads((source/'.delivery/edits-b.json').read_text())
          new=json.loads((source/'.delivery/new-files.json').read_text())
          paths=[x['path'] for x in edits+new]
          assert len(edits)==26 and len(new)==19 and len(set(paths))==45
          assert subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()=='9e20583e35af8917dde427198aa2063d7d66a126'
          def sha(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def safe(name):
            p=pathlib.PurePosixPath(name)
            assert not p.is_absolute() and '..' not in p.parts
            assert name.startswith(('src/','scripts/')) or name=='.github/workflows/hero-acceptance.yml'
            return root/name
          for item in edits:
            dest=safe(item['path']); data=dest.read_bytes()
            assert sha(data)==item['old'],f"Old source mismatch: {item['path']}"
            text=data.decode('utf-8'); changes=item['edits']
            last=0
            for start,end,replacement in changes:
              assert last<=start<=end<=len(text)
              last=end
            for start,end,replacement in reversed(changes): text=text[:start]+replacement+text[end:]
            encoded=text.encode('utf-8')
            assert sha(encoded)==item['new'],f"Edited source mismatch: {item['path']} ({sha(encoded)})"
            dest.write_bytes(encoded)
          for item in new:
            dest=safe(item['path']); assert not dest.exists(),item['path']
            data=(source/item['path']).read_bytes()
            assert len(data)==item['size'] and sha(data)==item['sha'],f"New source mismatch: {item['path']} ({sha(data)})"
            dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
          subprocess.run(['git','add','--',*paths],cwd=root,check=True)
          tree=subprocess.check_output(['git','write-tree'],cwd=root,text=True).strip()
          assert tree=='22510486d90349287c9ae3fe9c4e805702170863',f'Wrong complete tree: {tree}'
          assert not (root/'.delivery').exists()
          assert not (root/'.github/workflows/delivery-clarity-labels.yml').exists()
          print('Verified 45 files and exact release tree:',tree)
          PY
      - name: Commit to a temporary delivery branch, never main
        working-directory: release
        shell: bash
        run: |
          git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m 'feat: visual search, beginner clarity and physical small-vial labels'
          git push origin HEAD:refs/heads/delivery/clarity-labels-ready-2026-09-24
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
