name: Content acceptance and public observation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: content-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: bacwater_audit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U audit -d bacwater_audit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://audit:isolated-ci-only@127.0.0.1:5432/bacwater_audit
      AUTH_SECRET: ci-placeholder-not-a-real-secret
      AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
      AUDIT_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare isolated application
        run: |
          mkdir -p audit-evidence
          npm ci
          npx prisma generate
          case "$DATABASE_URL" in
            postgresql://audit:*@127.0.0.1:5432/bacwater_audit) ;;
            *) exit 1 ;;
          esac
          npx prisma db push --skip-generate
          npx tsx prisma/seed.ts
          npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.63.0
      - name: Install pinned browser dependencies
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.63.0
          npx playwright install --with-deps chromium
      - name: Start test server
        id: server
        run: |
          npx next start --hostname 127.0.0.1 --port 3000 > audit-evidence/server.log 2>&1 &
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/robots.txt && exit 0 || sleep 2; done
          exit 1
      - name: Verify revised content and mobile input access
        run: node scripts/audit-final-content.mjs
      - name: Observe public deployment and equivalent lab conditions
        if: ${{ !cancelled() && steps.server.outcome == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: node scripts/audit-public-observation.mjs
      - name: Preserve exact source
        if: always()
        run: |
          git rev-parse HEAD > audit-evidence/source-commit.txt
          git archive --format=tar HEAD > audit-evidence/source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-acceptance-${{ github.sha }}
          path: audit-evidence/
          retention-days: 14
