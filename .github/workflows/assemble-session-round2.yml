name: Assemble reviewed input corrections
on:
  push:
    branches: [delivery/session-schedule-source-2026-09-24]
    paths: [.github/workflows/assemble-session-round2.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply a checksummed source delta to the exact review base
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          base = '4dd8410da92d14e4c549a939c0daad3680c4aad1'
          raw = lzma.decompress(base64.b64decode(pathlib.Path('delivery/session-round2.b64').read_text().strip(), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '883d858bec29c0d224f0b63a326bf64a8a6ec0ac0e2594b48c3ee9cee8c04f6b'
          records = json.loads(raw)
          subprocess.run(['git', 'checkout', '--detach', base], check=True)
          paths = []
          for r in records:
              p = pathlib.Path(r['path'])
              assert not p.is_absolute() and '..' not in p.parts and p.parts[0] in ['src','scripts']
              old = p.read_text()
              assert hashlib.sha256(old.encode()).hexdigest() == r['old'], str(p)
              lines = old.splitlines(keepends=True)
              for a,b,replacement in reversed(r['ops']):
                  assert 0 <= a <= b <= len(lines)
                  lines[a:b] = replacement.splitlines(keepends=True)
              new = ''.join(lines)
              assert hashlib.sha256(new.encode()).hexdigest() == r['new'], str(p)
              p.write_text(new); paths.append(str(p))
          subprocess.run(['git','add','--',*paths], check=True)
          tree = subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree == '897f108ff673026565826e06cdf4c752f9e3895a'
          subprocess.run(['git','config','user.name','webIQ'],check=True)
          subprocess.run(['git','config','user.email','info@webiq.co'],check=True)
          commit = subprocess.check_output(['git','commit-tree',tree,'-p',base],input='fix: retain partial decimals and improve mobile question space\n',text=True).strip()
          subprocess.run(['git','push','origin',commit+':refs/heads/delivery/session-round2-reviewed'],check=True)
          print('Verified tree:',tree,'Source commit:',commit)
          PY
