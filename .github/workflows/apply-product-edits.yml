name: Apply authored product changes
on:
  push:
    branches: [product-clarity-2026-09-25]
    paths: [.github/workflows/apply-product-edits.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/product-clarity-2026-09-25'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply hash-checked authored text edits and remove transport helpers
        run: |
          python3 - <<'PY'
          import gzip, hashlib, json, subprocess
          from pathlib import Path, PurePosixPath
          parts = [Path(f'.github/product-edits.part{i}') for i in range(9)]
          raw = gzip.decompress(b''.join(p.read_bytes() for p in parts))
          assert hashlib.sha256(raw).hexdigest() == 'f87ec23076d19814033e0ee3af0f6d3ff408af2d255efc660a3b0edd75fe44da', 'Payload mismatch'
          records = json.loads(raw)
          assert isinstance(records, list) and len(records) == 47
          changes = []
          seen = set()
          digest = lambda s: hashlib.sha256(s.encode('utf-8')).hexdigest()
          export = '.github/workflows/product-review-workspace.yml'
          for r in records:
              name = r['path']
              p = PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and name not in seen
              assert name.startswith(('src/', 'scripts/', 'audit/')) or name == export
              assert not any(part in ('.env', 'node_modules', 'prisma') for part in p.parts)
              seen.add(name)
              path = Path(name)
              base = r['base']
              if base is None:
                  assert not path.exists(), 'New file already exists: ' + name
                  text = r['content']
              else:
                  old = path.read_text(encoding='utf-8')
                  assert digest(old) == base, 'Source changed: ' + name
                  if r.get('delete'):
                      assert name == export
                      changes.append((path, None))
                      continue
                  edits = r['edits']
                  last = 0
                  for a, b, replacement in edits:
                      assert isinstance(a, int) and isinstance(b, int) and last <= a <= b <= len(old)
                      assert isinstance(replacement, str)
                      last = b
                  text = old
                  for a, b, replacement in reversed(edits):
                      text = text[:a] + replacement + text[b:]
                  assert digest(text) == r['result'], 'Result changed: ' + name
              changes.append((path, text))
          for path, text in changes:
              if text is None:
                  path.unlink()
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(text, encoding='utf-8')
          helper = Path('.github/workflows/apply-product-edits.yml')
          transport = parts + [helper]
          for path in transport:
              path.unlink()
          paths = [str(p) for p, _ in changes] + [str(p) for p in transport]
          subprocess.run(['git', 'add', '-A', '--', *paths], check=True)
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert staged == set(paths), 'Unexpected staged files'
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Apply exact partner product names, plain-language research details and redesigned product panels'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:product-clarity-2026-09-25'], check=True)
          print('Applied all 47 authored file changes. Transport helpers removed. No production action.')
          PY
