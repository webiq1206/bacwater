name: Transfer reviewed session source objects
on:
  push:
    branches: [delivery/session-objects-20260924]
    paths:
      - .github/workflows/session-object-transfer.yml
      - .delivery/session-objects.py
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'webiq1206/bacwater'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and transfer exact reviewed source blobs without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .delivery/session-objects.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-session-source-objects
          path: /tmp/bacwater-session-objects.json
          retention-days: 7
