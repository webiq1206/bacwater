name: Master audit evidence

on:
  push:
    branches: [audit/master-2026-09-21]

permissions:
  contents: read

concurrency:
  group: master-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-placeholder-not-a-real-secret
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: https://bacwater.ai
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve exact tracked source
        run: |
          mkdir -p audit-evidence
          git rev-parse HEAD > audit-evidence/source-commit.txt
          git archive --format=tar HEAD > audit-evidence/source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: source-baseline-${{ github.sha }}
          path: audit-evidence/
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test existing calculation and guardrail suites
        run: npm test
      - name: Build
        run: npx next build
      - name: Install audit-only browser tools
        run: |
          npm install --no-save --package-lock=false @playwright/test axe-core
          npx playwright install --with-deps chromium firefox webkit
          npm list @playwright/test axe-core > audit-evidence/audit-tool-versions.txt
      - name: Read-only live site audit
        run: node scripts/master-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: master-audit-evidence-${{ github.sha }}
          path: audit-evidence/
          retention-days: 14
