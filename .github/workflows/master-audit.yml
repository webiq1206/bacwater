name: Master audit evidence

on:
  push:
    branches: [audit/master-2026-09-21]

permissions:
  contents: write

concurrency:
  group: master-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: bacwater_audit
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://audit:isolated-ci-only@127.0.0.1:5432/bacwater_audit
      AUTH_SECRET: ci-placeholder-not-a-real-secret
      AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply reviewed foundation patch
        run: python audit/2026-09-21/apply-foundation.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and prepare isolated fixtures
        run: |
          npm ci
          npx prisma generate
          case "$DATABASE_URL" in
            postgresql://audit:*@127.0.0.1:5432/bacwater_audit) ;;
            *) echo 'Refusing to initialize any non-test database'; exit 1 ;;
          esac
          npx prisma db push --skip-generate
          npx tsx prisma/seed.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npx next build
      - name: Commit only validated repair files to the audit branch
        run: |
          test "$GITHUB_REF" = refs/heads/audit/master-2026-09-21
          git add -A -- src package.json audit/2026-09-21
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: enforce plan ownership, protect private notes and escape content'
            git push origin HEAD:audit/master-2026-09-21
          fi
      - name: Capture resulting code and verification evidence
        if: always()
        run: |
          mkdir -p audit-evidence
          git rev-parse HEAD > audit-evidence/source-commit.txt
          git archive --format=tar HEAD > audit-evidence/source.tar
          git diff > audit-evidence/uncommitted.patch
          git status --short > audit-evidence/worktree-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validated-source-${{ github.sha }}
          path: audit-evidence/
          retention-days: 14
