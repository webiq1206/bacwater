name: Browser and privacy regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: browser-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: bacwater_audit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U audit -d bacwater_audit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://audit:isolated-ci-only@127.0.0.1:5432/bacwater_audit
      AUTH_SECRET: ci-placeholder-not-a-real-secret
      AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
      AUDIT_ORIGIN: http://127.0.0.1:3000
      AUDIT_OUT: audit-evidence/after
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install reviewed dependencies and inspect advisories
        run: |
          mkdir -p audit-evidence
          git rev-parse HEAD > audit-evidence/source-commit.txt
          npm ci
          npm audit --json > audit-evidence/dependency-audit.json || true
          node -e 'const a=require("./audit-evidence/dependency-audit.json");if(!a.metadata||a.metadata.vulnerabilities.critical||a.metadata.vulnerabilities.high)process.exit(1)'
      - name: Prepare disposable test database only
        run: |
          case "$DATABASE_URL" in
            postgresql://audit:*@127.0.0.1:5432/bacwater_audit) ;;
            *) echo 'Refusing a non-test database'; exit 1 ;;
          esac
          npx prisma generate
          npx prisma db push --skip-generate
          npx tsx prisma/seed.ts
      - name: Typecheck, unit tests and database transactions
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee audit-evidence/typecheck.log
          npm test 2>&1 | tee audit-evidence/tests.log
          npm run test:design 2>&1 | tee audit-evidence/design-unit-tests.log
          npx tsx scripts/audit-publication.ts 2>&1 | tee audit-evidence/publication-tests.log
          npx tsx scripts/audit-remaining.ts 2>&1 | tee audit-evidence/remaining-tests.log
      - name: Reproduce stale Replit development artifacts
        run: node scripts/audit-build-type-isolation.mjs seed
      - name: Production build with stale development artifacts present
        run: set -o pipefail; npm run build 2>&1 | tee audit-evidence/build.log
      - name: Verify production type isolation and genuine error detection
        run: set -o pipefail; node scripts/audit-build-type-isolation.mjs verify 2>&1 | tee audit-evidence/build-type-isolation.log
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.63.0
      - name: Install pinned browser audit tools
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.63.0 axe-core@4.13.0
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get install -y poppler-utils
      - name: Start local production build
        id: server
        run: |
          npx next start --hostname 127.0.0.1 --port 3000 > audit-evidence/server.log 2>&1 &
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/robots.txt && exit 0 || sleep 2; done
          exit 1
      - name: Verify publication lifecycle
        run: node scripts/audit-publication-browser.mjs
      - name: Verify converters
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node scripts/audit-converters.mjs
      - name: Verify arithmetic, explanations and keyboard journeys
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node scripts/audit-remaining-browser.mjs
      - name: Verify accounts, saved plans and private PDF text
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: |
          node scripts/audit-journeys.mjs
          pdftotext audit-evidence/journeys/owner.pdf audit-evidence/journeys/owner.txt
          pdftotext audit-evidence/journeys/shared.pdf audit-evidence/journeys/shared.txt
          grep -q 'PRIVATE NOTE' audit-evidence/journeys/owner.txt
          if grep -q 'PRIVATE NOTE' audit-evidence/journeys/shared.txt; then exit 1; fi
          if grep -q 'shelf life comes from research' audit-evidence/journeys/owner.txt; then exit 1; fi
      - name: Verify all public routes, accessibility and responsive engines
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: |
          node scripts/master-audit.mjs
          node - <<'JS'
          const fs = require('fs');
          const read = name => JSON.parse(fs.readFileSync(`audit-evidence/after/${name}.json`));
          const summary = read('summary'), responsive = read('responsive-engines'), http = read('http-inventory'), renders = read('rendered-pages');
          if (summary.errors || summary.pagesWithOverflow.length || summary.violations.length) process.exit(1);
          if (responsive.some(r => r.error || r.errors?.length || r.horizontalOverflow)) process.exit(1);
          if (http.unvisited.length || http.queueRemaining.length || http.pages.some(p => p.error || p.status !== 200)) process.exit(1);
          if (http.endpoints.filter(r => r.requested.includes('does-not-exist-audit')).some(r => r.status !== 404)) process.exit(1);
          if (renders.some(r => !r.title || r.h1?.length !== 1 || r.errors?.length || r.schema?.some(s => s?.parseError))) process.exit(1);
          console.log(`Verified ${summary.httpPages} URLs, ${summary.rendered} renders and ${summary.responsive} responsive/engine checks.`);
          JS
      - name: Verify dedicated calculator screens and full-height homepage
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: |
          node scripts/audit-calculator-focus.mjs
          node scripts/audit-calculator-reflow.mjs
      - name: Verify sitewide design and supplier sliders
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node scripts/audit-sitewide-design.mjs
      - name: Record original calculator demonstrations
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node scripts/record-calculator-demos.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification-${{ github.sha }}
          path: audit-evidence/
          retention-days: 14
